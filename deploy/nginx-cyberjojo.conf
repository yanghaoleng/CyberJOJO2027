server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cyberjojo.mikeywa.site;

    ssl_certificate /etc/letsencrypt/live/cyberjojo.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberjojo.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jocam/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/voice {
        proxy_pass http://127.0.0.1:8787/voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
        proxy_send_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /api/vision {
        proxy_pass http://127.0.0.1:8787/vision;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 260k;
    }

    location = /api/conversation-summary {
        proxy_pass http://127.0.0.1:8787/conversation-summary;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 680k;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    }

    location ~* \.(?:css|js|wasm|riv|tflite|task|ttf|png|webp|svg|mp3|ico)$ {
        try_files $uri =404;
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cyberjojo.mikeywa.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}
